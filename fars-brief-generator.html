<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flock Safety — FARS State Brief Generator</title>
<style>
  :root {
    --flock-dark: #1a1a2e;
    --flock-blue: #0f3460;
    --flock-accent: #e94560;
    --flock-light: #f5f5f7;
    --flock-green: #2ecc71;
    --flock-orange: #f39c12;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --text: #333;
    --text-light: #666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--flock-light);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--flock-dark), var(--flock-blue));
    color: white; padding: 2rem; text-align: center;
  }
  header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.25rem; }
  header p { opacity: 0.8; font-size: 0.95rem; }
  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .card {
    background: var(--card-bg); border-radius: 12px; padding: 1.5rem;
    margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }
  .card h2 {
    font-size: 1.2rem; margin-bottom: 1rem; color: var(--flock-dark);
    border-bottom: 2px solid var(--flock-accent); padding-bottom: 0.5rem;
    display: inline-block;
  }
  .selector-row {
    display: flex; gap: 1rem; align-items: end; flex-wrap: wrap;
  }
  .input-item { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
  .input-item label {
    font-size: 0.8rem; font-weight: 600; color: var(--text-light);
    margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .input-item select, .input-item input {
    padding: 0.6rem 0.75rem; border: 1.5px solid var(--border);
    border-radius: 6px; font-size: 1rem;
  }
  .btn {
    padding: 0.65rem 1.5rem; border: none; border-radius: 6px;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--flock-blue); color: white; }
  .btn-primary:hover { background: var(--flock-dark); }
  .btn-print { background: var(--flock-accent); color: white; }
  .btn-print:hover { opacity: 0.9; }
  .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; }

  /* Brief output */
  #briefOutput { display: none; }
  #briefOutput.visible { display: block; }

  .brief {
    background: white; border: 1px solid var(--border); border-radius: 12px;
    padding: 2rem; max-width: 850px; margin: 0 auto;
  }
  .brief-header {
    text-align: center; border-bottom: 3px solid var(--flock-dark);
    padding-bottom: 1rem; margin-bottom: 1.5rem;
  }
  .brief-header h1 { font-size: 1.5rem; color: var(--flock-dark); }
  .brief-header .subtitle { color: var(--text-light); font-size: 0.9rem; }
  .brief-header .tagline {
    font-size: 0.85rem; color: var(--flock-accent); font-weight: 600;
    margin-top: 0.5rem;
  }

  .stat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem; margin: 1.25rem 0;
  }
  .stat-box {
    background: #f8f9fa; border-radius: 8px; padding: 0.75rem;
    text-align: center; border: 1px solid var(--border);
  }
  .stat-box .stat-value {
    font-size: 1.4rem; font-weight: 800; color: var(--flock-dark);
  }
  .stat-box .stat-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-light); font-weight: 600;
  }
  .stat-box.alert { background: #fef0f0; border-color: #f5c6cb; }
  .stat-box.alert .stat-value { color: var(--flock-accent); }

  .section-title {
    font-size: 1rem; font-weight: 700; color: var(--flock-blue);
    margin: 1.25rem 0 0.5rem; border-left: 3px solid var(--flock-accent);
    padding-left: 0.5rem;
  }

  .data-table {
    width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 0.5rem 0;
  }
  .data-table th {
    background: var(--flock-dark); color: white; padding: 0.5rem 0.75rem;
    text-align: left; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .data-table td {
    padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--border);
  }
  .data-table tr:nth-child(even) { background: #f8f9fa; }

  .cost-comparison {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 0.75rem 0;
  }
  .cost-box {
    border-radius: 8px; padding: 1rem; text-align: center;
  }
  .cost-box.legacy { background: #fef0f0; border: 1px solid #f5c6cb; }
  .cost-box.flock { background: #e8f8f0; border: 1px solid #b8e6d0; }
  .cost-box .cost-label {
    font-size: 0.75rem; text-transform: uppercase; font-weight: 600;
    color: var(--text-light);
  }
  .cost-box .cost-value { font-size: 1.3rem; font-weight: 800; }
  .cost-box.legacy .cost-value { color: var(--flock-accent); }
  .cost-box.flock .cost-value { color: var(--flock-green); }
  .cost-box .cost-detail { font-size: 0.8rem; color: var(--text-light); }

  .talking-points {
    background: #fffdf0; border: 1px solid #f0e6b0; border-radius: 8px;
    padding: 1rem; margin: 1rem 0;
  }
  .talking-points h4 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--flock-orange); margin-bottom: 0.5rem;
  }
  .talking-points ul { list-style: none; padding: 0; }
  .talking-points li {
    font-size: 0.85rem; padding: 0.3rem 0 0.3rem 1.25rem; position: relative;
  }
  .talking-points li::before {
    content: ">"; position: absolute; left: 0;
    color: var(--flock-orange); font-weight: 700;
  }

  .bar-chart { margin: 0.75rem 0; }
  .bar-row { display: flex; align-items: center; margin-bottom: 0.5rem; }
  .bar-label { width: 80px; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; }
  .bar-track {
    flex: 1; height: 24px; background: #eee; border-radius: 4px;
    overflow: hidden; position: relative;
  }
  .bar-fill {
    height: 100%; border-radius: 4px; display: flex; align-items: center;
    justify-content: flex-end; padding-right: 6px; font-size: 0.7rem;
    font-weight: 700; color: white; transition: width 0.4s; min-width: 40px;
  }
  .bar-fill.y1 { background: #e74c3c; }
  .bar-fill.y2 { background: #e67e22; }
  .bar-fill.y3 { background: #f39c12; }
  .bar-fill.y4 { background: #3498db; }

  .brief-footer {
    margin-top: 1.5rem; padding-top: 1rem;
    border-top: 2px solid var(--border); text-align: center;
    font-size: 0.75rem; color: var(--text-light);
  }
  .brief-footer .source { font-style: italic; }
  .brief-footer .cta { color: var(--flock-accent); font-weight: 700; font-size: 0.85rem; margin-top: 0.5rem; }

  /* Pipeline context */
  .pipeline-note {
    background: #e8f0fe; border: 1px solid #b3d1ff; border-radius: 8px;
    padding: 0.75rem 1rem; margin: 0.75rem 0; font-size: 0.85rem;
  }
  .pipeline-note strong { color: var(--flock-blue); }

  /* Multi-state view */
  .state-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .mini-card {
    background: white; border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem; cursor: pointer; transition: all 0.2s;
  }
  .mini-card:hover { border-color: var(--flock-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .mini-card h3 { font-size: 1rem; color: var(--flock-dark); }
  .mini-card .mini-stats { display: flex; gap: 1rem; margin-top: 0.5rem; }
  .mini-stat { font-size: 0.8rem; }
  .mini-stat .mv { font-weight: 700; color: var(--flock-accent); }

  @media print {
    header, .card:first-of-type, .btn-row { display: none; }
    #briefOutput { display: block !important; }
    .brief { box-shadow: none; border: none; padding: 0; }
    .container { padding: 0; }
    body { background: white; }
  }

  @media (max-width: 700px) {
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .cost-comparison { grid-template-columns: 1fr; }
    .state-cards { grid-template-columns: 1fr; }
    .selector-row { flex-direction: column; }
  }
</style>
</head>

// Populate state dropdown
function populateStates() {
  const select = document.getElementById('stateSelect');
  const sorted = Object.values(STATE_DATA).sort((a, b) => a.name.localeCompare(b.name));
  sorted.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.abbr;
    opt.textContent = `${s.name} (${s.abbr})` + (s.pipelineTier === "1" ? " ★" : s.pipelineTier === "2" ? " ●" : "");
    select.appendChild(opt);
  });
}

function fmt(n) { return '$' + Math.round(n).toLocaleString(); }
function fmtM(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return fmt(n);
}

function generateBrief() {
  const abbr = document.getElementById('stateSelect').value;
  const ctx = document.getElementById('contextSelect').value;
  if (!abbr) return;

  const s = STATE_DATA[abbr];
  if (!s) return;

  const el = document.getElementById('briefOutput');
  el.classList.add('visible');
  document.getElementById('pipelineView').innerHTML = '';

  // Calculate derived metrics
  const years = Object.keys(s.fatalities).map(Number).sort();
  const latestYear = years[years.length - 1];
  const totalFatalities = years.reduce((sum, y) => sum + s.fatalities[y], 0);
  const avgFatalities = Math.round(totalFatalities / years.length);
  const latestFatalities = s.fatalities[latestYear];
  const latestRate = s.fatalityRate[latestYear];

  // WWD estimates
  const wwdFatalCrashesPerYear = Math.round(avgFatalities * (s.wwdPct / 100));
  const wwdFatalitiesPerYear = Math.round(wwdFatalCrashesPerYear * 1.35); // WWD fatality multiplier
  const wwdTotal3Yr = Math.round(wwdFatalitiesPerYear * 3);
  const wwdAlcoholInvolved = Math.round(wwdFatalitiesPerYear * (s.wwdAlcoholPct / 100));

  // Economic impact
  const vslPerFatality = 12500000; // FHWA 2024
  const avgCrashCostNonFatal = 500000;
  const wwdEconomicLossAnnual = (wwdFatalitiesPerYear * vslPerFatality) + (wwdFatalCrashesPerYear * 0.3 * avgCrashCostNonFatal);

  // Ramp estimates (based on interstate mileage)
  const estHighRiskRamps = Math.round(s.laneMiles * 0.008); // rough estimate
  const estProtected = Math.round(estHighRiskRamps * 0.06); // ~6% nationally
  const unprotectedPct = ((estHighRiskRamps - estProtected) / estHighRiskRamps * 100).toFixed(0);

  // Cost comparisons
  const legacyCostPerSite = 100000;
  const flockCostPerSite = 15000;
  const target20Sites = Math.min(20, estHighRiskRamps);
  const legacyCost20 = target20Sites * legacyCostPerSite;
  const flockCost20 = target20Sites * flockCostPerSite;
  const flockAllRamps = estHighRiskRamps * flockCostPerSite;

  // TA value
  const taPriceEstimate = s.laneMiles > 40000 ? 90000 : s.laneMiles > 20000 ? 60000 : s.laneMiles > 10000 ? 40000 : 25000;

  // Year-over-year bars
  const maxFat = Math.max(...years.map(y => s.fatalities[y]));

  // Conference context
  let confNote = '';
  if (ctx !== 'general') {
    const conf = CONFERENCE_TARGETS[ctx];
    if (conf) {
      const isTarget = conf.states.includes(abbr);
      confNote = `<div class="pipeline-note"><strong>${conf.name}:</strong> ${isTarget ? `${s.name} is a PRIMARY TARGET at this event.` : `${s.name} is not a primary target, but opportunistic outreach is valuable.`} Focus: ${conf.focus}</div>`;
    }
  }

  // Pipeline context
  let pipelineNote = '';
  if (s.contacts.length > 0 || s.notes) {
    pipelineNote = `<div class="pipeline-note">
      <strong>Pipeline Tier ${s.pipelineTier}</strong> |
      Products: ${s.products.join(', ')} |
      Contacts: ${s.contacts.length > 0 ? s.contacts.join(', ') : 'TBD'}
      <br>${s.notes}
    </div>`;
  }

      <div class="brief-header">
        <h1>${s.name} — Transportation Safety Brief</h1>
        <div class="subtitle">Prepared for Flock Safety | ${s.name} Department of Transportation</div>
        <div class="tagline">Data-Driven Case for Modern Safety & Monitoring Technology</div>
      </div>

      ${confNote}
      ${pipelineNote}

      <div class="section-title">Statewide Fatality Snapshot (FARS)</div>
      <div class="stat-grid">
        <div class="stat-box alert">
          <div class="stat-value">${latestFatalities.toLocaleString()}</div>
          <div class="stat-label">Fatalities (${latestYear})</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${latestRate.toFixed(2)}</div>
          <div class="stat-label">Rate per 100M VMT</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${s.vmt[latestYear]}B</div>
          <div class="stat-label">VMT (${latestYear})</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${s.laneMiles.toLocaleString()}</div>
          <div class="stat-label">Lane-Miles Managed</div>
        </div>
      </div>

      <div class="bar-chart">
        ${years.map((y, i) => `
          <div class="bar-row">
            <div class="bar-label">${y}</div>
            <div class="bar-track">
              <div class="bar-fill y${i+1}" style="width:${(s.fatalities[y]/maxFat*100).toFixed(1)}%">${s.fatalities[y].toLocaleString()}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="section-title">Wrong-Way Driving Exposure</div>
      <div class="stat-grid">
        <div class="stat-box alert">
          <div class="stat-value">~${wwdFatalitiesPerYear}</div>

        </div>
        <div class="stat-box alert">

        </div>

      <div class="data-table" style="margin: 0.75rem 0;">
        <table class="data-table">
          <tr>
            <th>Metric</th>
            <th>Value</th>
          </tr>
          <tr><td>Estimated high-risk ramps</td><td>${estHighRiskRamps}</td></tr>
          <tr><td>Currently protected (est.)</td><td>~${estProtected}</td></tr>

          <tr><td>High-risk interstate corridors</td><td>${s.interstateHighRisk.join(', ')}</td></tr>
          <tr><td>National avg. WWD fatality rate</td><td>27x higher than standard crashes</td></tr>
        </table>
      </div>

      <div class="section-title">WWD Cost Comparison: Legacy vs. Flock</div>
      <div class="cost-comparison">
        <div class="cost-box legacy">
          <div class="cost-label">Legacy Infrastructure (${target20Sites} sites)</div>
          <div class="cost-value">${fmtM(legacyCost20)}</div>

        </div>
        <div class="cost-box flock">

      <div class="cost-comparison">

          <div class="cost-detail">Capital expenditure — likely never funded</div>
        </div>
        <div class="cost-box flock">

        </div>
      </div>

      <div class="section-title">Total Addressable Spend — ${s.name}</div>
      <div class="data-table" style="margin: 0.75rem 0;">
        <table class="data-table">
          <tr>
            <th>Product</th>
            <th>Scope</th>
            <th>Estimated Annual Value</th>
          </tr>
          <tr><td>Wrong-Way Driving</td><td>${target20Sites}–${estHighRiskRamps} sites</td><td>${fmtM(flockCost20)} – ${fmtM(flockAllRamps)}</td></tr>
          <tr><td>Traffic Analytics</td><td>Statewide platform</td><td>${fmtM(taPriceEstimate)}</td></tr>
          <tr><td>Drone (DFR)</td><td>2–4 drones + PTZ</td><td>$300K – $550K</td></tr>

        </table>
      </div>

      <div class="section-title">Funding Pathways</div>
      <div class="data-table" style="margin: 0.75rem 0;">
        <table class="data-table">
          <tr><th>Program</th><th>Eligible Products</th><th>Notes</th></tr>
          <tr><td>HSIP</td><td>WWD, TA, PTZ</td><td>Dedicated safety $ — WWD explicitly eligible</td></tr>
          <tr><td>SS4A</td><td>WWD, TA, DFR</td><td>Safe Streets — technology countermeasures</td></tr>
          <tr><td>PROTECT</td><td>TA, PTZ</td><td>Resilience + monitoring applications</td></tr>
          <tr><td>State Safety Funds</td><td>All</td><td>Varies by state — check HSIP set-asides</td></tr>
        </table>
      </div>

      <div class="talking-points">
        <h4>Discovery Questions for ${s.name}</h4>
        <ul>
          <li>"How many of your ${estHighRiskRamps} high-risk ramps have wrong-way detection today?" (Answer is likely ~${estProtected})</li>
          <li>"${s.name} has averaged ~${wwdFatalitiesPerYear} wrong-way fatalities per year. What's your current detection-to-notification time?"</li>
          <li>"Your count program covers how many of your ${s.laneMiles.toLocaleString()} lane-miles with continuous data?"</li>
          <li>"What's your annual spend on short-term traffic counts? How many permanent stations do you operate?"</li>
          <li>"If there were a wrong-way fatality on ${s.interstateHighRisk[0]} tomorrow on an unprotected ramp, what would the agency's response be?"</li>
          ${s.wwdAlcoholPct > 45 ? `<li>"${s.wwdAlcoholPct}% of your WWD events involve alcohol — these are nighttime, impaired drivers. Your detection system needs to work at 2 AM without human monitoring."</li>` : ''}
        </ul>
      </div>

      <div class="talking-points">
        <h4>Key Talking Points</h4>
        <ul>
          <li>"${s.name} had ${latestFatalities.toLocaleString()} traffic fatalities in ${latestYear} — a rate of ${latestRate.toFixed(2)} per 100M VMT. Wrong-way crashes account for ~${s.wwdPct}% of fatal crashes but with 27x higher fatality rates."</li>

function showAllPipelineStates() {
  document.getElementById('briefOutput').classList.remove('visible');
  document.getElementById('briefOutput').innerHTML = '';

  const tiers = { "1": [], "2": [], "3": [], "B": [] };
  Object.values(STATE_DATA).forEach(s => {
    const tier = s.pipelineTier;
    if (tiers[tier]) tiers[tier].push(s);
  });

  const tierLabels = {
    "1": "Tier 1 — Close This Quarter",
    "2": "Tier 2 — Q2 Pipeline",
    "3": "Tier 3 — Longer-Term & Nurture",
    "B": "Tier B — Conference-Primed"
  };

  let html = '';
  ["1", "2", "3", "B"].forEach(tier => {
    if (tiers[tier].length === 0) return;
    html += `<div class="card"><h2>${tierLabels[tier]}</h2><div class="state-cards">`;
    tiers[tier].forEach(s => {
      const latestYear = Math.max(...Object.keys(s.fatalities).map(Number));
      const wwdEst = Math.round(s.fatalities[latestYear] * (s.wwdPct / 100) * 1.35);
      html += `
        <div class="mini-card" onclick="document.getElementById('stateSelect').value='${s.abbr}'; generateBrief(); window.scrollTo({top:0,behavior:'smooth'});">
          <h3>${s.name}</h3>
          <div style="font-size:0.8rem;color:var(--text-light);">${s.products.join(' + ')} | ${s.contacts.length > 0 ? s.contacts[0] : 'No contact'}</div>
          <div class="mini-stats">
            <div class="mini-stat"><span class="mv">${s.fatalities[latestYear].toLocaleString()}</span> fatalities (${latestYear})</div>
            <div class="mini-stat"><span class="mv">~${wwdEst}</span> est. WWD deaths/yr</div>
            <div class="mini-stat"><span class="mv">${s.wwdPct}%</span> WWD rate</div>
          </div>
          <div style="font-size:0.75rem;color:var(--text-light);margin-top:0.5rem;">${s.notes.substring(0, 100)}${s.notes.length > 100 ? '...' : ''}</div>
        </div>`;
    });
    html += '</div></div>';
  });

  document.getElementById('pipelineView').innerHTML = html;
}
